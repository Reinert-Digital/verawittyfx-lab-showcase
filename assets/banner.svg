<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="VeraWittyFX Lab: Trading Education Platform">
  <defs>
    <radialGradient id="g1" cx="22%" cy="10%" r="60%">
      <stop offset="0" stop-color="#722F37" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="95%" r="55%">
      <stop offset="0" stop-color="#DC143C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t" x1="0" x2="1">
      <stop offset="0" stop-color="#DC143C"/>
      <stop offset=".5" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#DC143C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#0A0A0A"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#g1)"/>
  <rect width="1280" height="400" fill="url(#g2)"/>

  <!-- Chartlinie -->
  <polyline points="760,300 820,270 870,285 930,220 985,240 1040,170 1095,190 1150,120 1210,95"
            fill="none" stroke="url(#t)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <circle cx="1210" cy="95" r="7" fill="#ff4d6d"/>

  <!-- Logo-Pfeil -->
  <polyline points="80,118 104,94 120,110 148,82" fill="none" stroke="#DC143C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="134,82 148,82 148,96" fill="none" stroke="#DC143C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="168" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">VeraWitty<tspan fill="#DC143C">FX</tspan> Lab</text>
  <text x="80" y="215" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#fff">Trading lernen</text>
  <text x="80" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#t)">mit System</text>
  <text x="80" y="345" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity=".55">Full-Stack Trading-Education-Plattform · Next.js · PostgreSQL · Stripe · Capacitor</text>
</svg>
